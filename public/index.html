<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Azure RPi Simulator</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      input, button, textarea { font-size: 1rem; padding: 8px; margin: 6px 0; width: 100%; }
      .row { display:flex; gap:10px; }
      .col { flex:1 }
    </style>
  </head>
  <body>
    <h1>Azure Raspberry Pi Web Simulator (simple)</h1>
    <p>This simple UI posts JSON with lowercase <code>text</code> and <code>tag</code> fields to the server, which forwards to Azure Event Hubs.</p>

    <label>Text</label>
    <textarea id="text" rows="4" placeholder="Enter text message"></textarea>

    <label>Tag</label>
    <input id="tag" placeholder="Enter tag" />

    <div class="row">
      <div class="col"><button id="sendBtn">Send once</button></div>
      <div class="col"><button id="autoBtn">Start auto (1/s)</button></div>
    </div>

    <h3>Log</h3>
    <pre id="log" style="height:200px; overflow:auto; background:#f7f7f7; padding:10px"></pre>

    <script src="/simulator.js"></script>
  </body>
</html>
